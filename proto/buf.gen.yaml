version: v1
plugins:
  - name: go
    out: build/go
    opt: paths=source_relative
  - name: go-grpc
    out: build/go
    opt:
      - paths=source_relative
      - require_unimplemented_servers=false
  - name: grpc-gateway
    out: build/go
    opt: paths=source_relative
  - name: openapiv2
    out: ../../docs
