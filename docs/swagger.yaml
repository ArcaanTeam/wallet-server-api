        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/wallet-server-api_internal_domain_models.ErrorResponse'
      summary: Delete user
      tags:
      - users-v1
    get:
      description: Get user details by user ID
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
