          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/wallet-server-api_internal_domain_models.SuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/wallet-server-api_internal_domain_models.User'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/wallet-server-api_internal_domain_models.ErrorResponse'
      summary: Get all users
      tags:
      - users-v1
    post:
